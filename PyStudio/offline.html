<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f15">
  <meta name="robots" content="noindex,nofollow">
  <title>PyStudio — Offline</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b0f15; color: #e3eaf3; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; min-height: 100dvh; margin: 0; padding: max(28px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left)); place-items: center; }
    main { width: min(100%, 460px); padding: clamp(24px, 7vw, 40px); border: 1px solid #252f3c; border-radius: 22px; background: linear-gradient(150deg, #141d27, #10151d 72%); box-shadow: 0 24px 80px rgba(0,0,0,.32); }
    img { display: block; width: 76px; height: 76px; margin-bottom: 26px; border-radius: 19px; }
    .eyebrow { margin: 0 0 9px; color: #53d7cf; font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: clamp(25px, 7vw, 34px); letter-spacing: -.045em; }
    p { margin: 0 0 14px; color: #a5b2c2; font-size: 14px; line-height: 1.7; }
    .saved-note { margin-top: 20px; padding: 12px 14px; border: 1px solid rgba(83,215,207,.2); border-radius: 10px; background: rgba(83,215,207,.07); color: #c8d6df; font-size: 12px; }
    a { display: inline-flex; min-height: 42px; align-items: center; justify-content: center; margin-top: 22px; padding: 0 16px; border-radius: 9px; background: #53d7cf; color: #072323; font-size: 13px; font-weight: 800; text-decoration: none; }
    a:focus-visible { outline: 3px solid #e3eaf3; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="./icons/pystudio-192.png" alt="" width="76" height="76">
    <p class="eyebrow">Offline</p>
    <h1>Connect to keep coding.</h1>
    <p>PyStudio loads its editor and Python runtime from public CDNs. Reconnect to the internet, then try opening the IDE again.</p>
    <div class="saved-note">Your projects are stored in this browser. They are not uploaded to a server.</div>
    <a href="./">Try PyStudio again</a>
  </main>
</body>
</html>
